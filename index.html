<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Distribution GP — Carte des concessionnaires</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Microsoft Authentication Library -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.26.2/lib/msal-browser.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    /* --------------------------------------------------
       PANNEAU DE CONTRÔLE
    -------------------------------------------------- */

    .controls {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;

      width: 320px;
      max-width: calc(100vw - 30px);

      background: white;
      padding: 16px;

      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .controls h2 {
      margin: 0 0 12px 0;
      font-size: 19px;
    }

    .controls label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-top: 9px;
      margin-bottom: 4px;
    }

    .controls input,
    .controls select {
      width: 100%;
      box-sizing: border-box;

      padding: 9px;

      border: 1px solid #ccc;
      border-radius: 6px;

      font-size: 14px;
    }

    .controls button {
      width: 100%;
      margin-top: 10px;

      padding: 9px;

      border: none;
      border-radius: 6px;

      cursor: pointer;

      font-size: 14px;
    }

    .btn-primary {
      background: #1f6feb;
      color: white;
    }

    .btn-secondary {
      background: #eeeeee;
      color: #222;
    }

    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
    }

    /* --------------------------------------------------
       LÉGENDE
    -------------------------------------------------- */

    .legend {
      background: white;
      padding: 10px 14px;
      line-height: 24px;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.25);
    }

    .legend i {
      width: 14px;
      height: 14px;
      display: inline-block;
      margin-right: 7px;
      border-radius: 50%;
    }

    /* --------------------------------------------------
       POPUP
    -------------------------------------------------- */

    .popup-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .popup-section {
      margin-bottom: 8px;
    }

    .popup-label {
      font-weight: bold;
    }

    /* --------------------------------------------------
       COMPTEUR
    -------------------------------------------------- */

    .counter {
      margin-top: 10px;
      font-size: 13px;
      font-weight: bold;
    }
    
/* --------------------------------------------------
   MODE ITINÉRAIRE
-------------------------------------------------- */

.route-panel {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid #ddd;
}

.route-panel h3 {
  margin: 0 0 8px 0;
  font-size: 15px;
}

.route-button {
  background: #2c3e50;
  color: white;
}

.route-button.active {
  background: #27ae60;
}

.route-list {
  margin-top: 10px;
  font-size: 13px;
}

.route-stop {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid #eee;
}

.route-number {
  width: 23px;
  height: 23px;
  min-width: 23px;
  border-radius: 50%;
  background: #2c3e50;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.route-name {
  flex: 1;
}

.route-remove {
  border: none;
  background: transparent;
  color: #e74c3c;
  cursor: pointer;
  font-size: 18px;
  font-weight: bold;
  padding: 0;
  margin-left: 4px;
  width: 22px;
  min-width: 22px;
  flex: 0 0 22px;
}

.route-empty {
  color: #777;
  font-style: italic;
  margin-top: 8px;
}
    
  </style>
</head>

<body>

<div id="map"></div>

<div class="controls">

  <h2>Distribution GP</h2>

  <label for="search">
    Recherche
  </label>

  <input
    type="text"
    id="search"
    placeholder="Concessionnaire ou adresse..."
  >

  <label for="groupe">
    Groupe
  </label>

  <select id="groupe">
    <option value="">Tous les groupes</option>
  </select>

  <label for="statut">
    Statut
  </label>

  <select id="statut">
    <option value="">Tous les statuts</option>
  </select>

  <button
    class="btn-secondary"
    id="resetFilters"
  >
    Réinitialiser les filtres
  </button>

  <button
    class="btn-secondary"
    id="fitMap"
  >
    Afficher tous les concessionnaires
  </button>

  <div class="route-panel">

    <h3>Itinéraire</h3>

    <button
      class="route-button"
      id="routeMode"
    >
      Créer un itinéraire
    </button>

    <div
      class="route-list"
      id="routeList"
    >
      <div class="route-empty">
        Aucun arrêt sélectionné.
      </div>
    </div>

    <button
      class="btn-secondary"
      id="clearRoute"
      style="display:none;"
    >
      Effacer l’itinéraire
    </button>

  </div>  

  <div class="counter" id="counter">
    Chargement...
  </div>

  <div class="status" id="status">
    Connexion à Microsoft 365...
  </div>

</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  // ==================================================
  // CONFIGURATION MICROSOFT
  // ==================================================

  const CLIENT_ID =
    "d6c9bd33-1318-4052-8a82-66e70ea9f386";

  const TENANT_ID =
    "e64463ac-e97e-4259-9af9-eb6f999c1a60";

  const SHAREPOINT_HOST =
    "distributiongp403.sharepoint.com";

  const SHAREPOINT_SITE_PATH =
    "/sites/DISTRIBUTIONGP";

  const SHAREPOINT_LIST_NAME =
    "Concessionnaires";


  // ==================================================
  // INITIALISATION MSAL
  // ==================================================

  const msalConfig = {

    auth: {
      clientId: CLIENT_ID,
      authority:
        "https://login.microsoftonline.com/" + TENANT_ID,

      redirectUri:
        window.location.origin + "/"
    },

    cache: {
      cacheLocation: "sessionStorage",
      storeAuthStateInCookie: false
    }

  };


  const msalInstance =
    new msal.PublicClientApplication(msalConfig);


  const loginRequest = {

    scopes: [
      "Sites.Read.All"
    ]

  };


  // ==================================================
  // VARIABLES
  // ==================================================

  let concessionnaires = [];

  let markersLayer =
    L.layerGroup();

  // ==================================================
  // VARIABLES ITINÉRAIRE
  // ==================================================
  
let modeItineraire = false;
  
let itineraire = [];
  
let routeLayer = null;

  // ==================================================
  // CARTE
  // ==================================================

  const map =
    L.map("map").setView(
      [45.55, -73.5],
      8
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  markersLayer.addTo(map);


  // ==================================================
  // COULEUR DES STATUTS
  // ==================================================

  function couleurStatut(statut) {

    if (!statut) {
      return "#7f8c8d";
    }

    const s =
      String(statut).toLowerCase();

    if (
      s.includes("déjà client") ||
      s.includes("deja client")
    ) {
      return "#2ecc71"; // Vert
    }

    if (
      s.includes("déjà approché") ||
      s.includes("deja approche")
    ) {
      return "#f39c12"; // Jaune/Orange
    }

    if (
      s.includes("client mpp") ||
      s.includes("balcan")
    ) {
      return "#3498db"; // Bleu
    }
    

    if (
      s.includes("à venir") ||
      s.includes("a venir")
    ) {
      return "#e74c3c"; // Rouge
    }

    return "#7f8c8d";
  }


  // ==================================================
  // OBTENIR UNE VALEUR DE CHAMP SHAREPOINT
  // ==================================================

  function getField(fields, possibleNames) {

    if (!fields) {
      return "";
    }

    const keys =
      Object.keys(fields);

    for (const name of possibleNames) {

      if (fields[name] !== undefined) {
        return fields[name];
      }

    }

    // Recherche insensible à la casse
    for (const key of keys) {

      const normalizedKey =
        key
          .toLowerCase()
          .replace(/[\s_-]/g, "");

      for (const name of possibleNames) {

        const normalizedName =
          name
            .toLowerCase()
            .replace(/[\s_-]/g, "");

        if (
          normalizedKey === normalizedName
        ) {
          return fields[key];
        }

      }

    }

    return "";
  }


  // ==================================================
  // TRANSFORMER UN ÉLÉMENT SHAREPOINT
  // ==================================================

  function convertirConcessionnaire(item) {

    const fields =
      item.fields || {};

    return {

      id:
        item.id,

      nom:
        getField(
          fields,
          [
            "Concessionnaire",
            "Title",
            "Nom"
          ]
        ),

      groupe:
        getField(
          fields,
          [
            "Groupe"
          ]
        ),

      adresse:
        getField(
          fields,
          [
            "Adresse"
          ]
        ),

      contact:
        getField(
          fields,
          [
            "Contact"
          ]
        ),

      notes:
        getField(
          fields,
          [
            "Notes"
          ]
        ),

      statut:
        getField(
          fields,
          [
            "Statut"
          ]
        ),

      longitude:
        parseFloat(
          getField(
            fields,
            [
              "Longitude"
            ]
          )
        ),

      latitude:
        parseFloat(
          getField(
            fields,
            [
              "Latitude"
            ]
          )
        )

    };

  }


  // ==================================================
  // AUTHENTIFICATION
  // ==================================================

  async function obtenirToken() {

    const comptes =
      msalInstance.getAllAccounts();

    if (comptes.length === 0) {

      document.getElementById("status").textContent =
        "Connexion Microsoft 365 requise...";

      await msalInstance.loginRedirect(
        loginRequest
      );

      return null;

    }

    const compte =
      comptes[0];

    try {

      const response =
        await msalInstance.acquireTokenSilent({

          ...loginRequest,

          account: compte

        });

      return response.accessToken;

    }
    catch (error) {

      console.log(
        "Token silencieux impossible:",
        error
      );

      await msalInstance.acquireTokenRedirect(
        loginRequest
      );

      return null;

    }

  }


  // ==================================================
  // RÉCUPÉRER LE SITE SHAREPOINT
  // ==================================================

  async function obtenirSite(token) {

    const url =
      "https://graph.microsoft.com/v1.0/sites/" +
      SHAREPOINT_HOST +
      ":" +
      SHAREPOINT_SITE_PATH;

    const response =
      await fetch(
        url,
        {
          headers: {
            Authorization:
              "Bearer " + token
          }
        }
      );

    if (!response.ok) {

      const texte =
        await response.text();

      throw new Error(
        "Impossible de récupérer le site SharePoint: " +
        response.status +
        " " +
        texte
      );

    }

    return await response.json();

  }


  // ==================================================
  // RÉCUPÉRER LA LISTE
  // ==================================================

  async function obtenirListe(
    token,
    siteId
  ) {

    const url =
      "https://graph.microsoft.com/v1.0/sites/" +
      encodeURIComponent(siteId) +
      "/lists/" +
      encodeURIComponent(SHAREPOINT_LIST_NAME) +
      "/items?expand=fields&$top=999";

    const response =
      await fetch(
        url,
        {
          headers: {
            Authorization:
              "Bearer " + token
          }
        }
      );

    if (!response.ok) {

      const texte =
        await response.text();

      throw new Error(
        "Impossible de récupérer la liste SharePoint: " +
        response.status +
        " " +
        texte
      );

    }

    return await response.json();

  }


  // ==================================================
  // CHARGER LES CONCESSIONNAIRES
  // ==================================================

  async function chargerConcessionnaires() {

    try {

      document.getElementById("status").textContent =
        "Connexion à Microsoft 365...";

      const token =
        await obtenirToken();

      if (!token) {
        return;
      }


      document.getElementById("status").textContent =
        "Recherche du site SharePoint...";


      const site =
        await obtenirSite(token);


      document.getElementById("status").textContent =
        "Chargement des concessionnaires...";


      const data =
        await obtenirListe(
          token,
          site.id
        );


      concessionnaires =
        (data.value || [])
          .map(convertirConcessionnaire)
          .filter(function(c) {

            return (
              Number.isFinite(c.latitude) &&
              Number.isFinite(c.longitude)
            );

          });


      remplirFiltres();

      afficherConcessionnaires();

      document.getElementById("status").textContent =
        "Données SharePoint chargées.";

    }
    catch (error) {

      console.error(error);

      document.getElementById("status").innerHTML =
        "<b>Erreur :</b> " +
        error.message;

    }

  }


  // ==================================================
  // REMPLIR LES FILTRES
  // ==================================================

  function remplirFiltres() {

    const groupeSelect =
      document.getElementById("groupe");

    const statutSelect =
      document.getElementById("statut");


    // Nettoyer
    groupeSelect.innerHTML =
      '<option value="">Tous les groupes</option>';

    statutSelect.innerHTML =
      '<option value="">Tous les statuts</option>';


    // GROUPES
    const groupes =
      [
        ...new Set(
          concessionnaires
            .map(c => c.groupe)
            .filter(Boolean)
        )
      ]
      .sort();


    groupes.forEach(function(groupe) {

      const option =
        document.createElement("option");

      option.value =
        groupe;

      option.textContent =
        groupe;

      groupeSelect.appendChild(option);

    });


    // STATUTS
    const statuts =
      [
        ...new Set(
          concessionnaires
            .map(c => c.statut)
            .filter(Boolean)
        )
      ]
      .sort();


    statuts.forEach(function(statut) {

      const option =
        document.createElement("option");

      option.value =
        statut;

      option.textContent =
        statut;

      statutSelect.appendChild(option);

    });

  }


  // ==================================================
  // FILTRER
  // ==================================================

  function obtenirFiltres() {

    return {

      recherche:
        document
          .getElementById("search")
          .value
          .toLowerCase()
          .trim(),

      groupe:
        document
          .getElementById("groupe")
          .value,

      statut:
        document
          .getElementById("statut")
          .value

    };

  }


  function concessionnaireCorrespond(c, filtres) {

    const texte =
      (
        (c.nom || "") +
        " " +
        (c.adresse || "") +
        " " +
        (c.contact || "")
      )
      .toLowerCase();


    if (
      filtres.recherche &&
      !texte.includes(filtres.recherche)
    ) {
      return false;
    }


    if (
      filtres.groupe &&
      c.groupe !== filtres.groupe
    ) {
      return false;
    }


    if (
      filtres.statut &&
      c.statut !== filtres.statut
    ) {
      return false;
    }


    return true;

  }


  // ==================================================
  // AFFICHER LES MARQUEURS
  // ==================================================

  function afficherConcessionnaires() {

    markersLayer.clearLayers();


    const filtres =
      obtenirFiltres();


    const visibles =
      concessionnaires.filter(
        c =>
          concessionnaireCorrespond(
            c,
            filtres
          )
      );


    visibles.forEach(function(c) {
      
      
      const couleur =
  couleurStatut(c.statut);


// Vérifier si le concessionnaire est
// déjà dans l'itinéraire
const numero =
  itineraire.findIndex(
    x => x.id === c.id
  ) + 1;


// Si présent dans l'itinéraire,
// afficher son numéro.
// Sinon afficher la pastille normale.

const contenuIcone =
  numero > 0
    ? `
      <div style="
        width:28px;
        height:28px;
        background:${couleur};
        border:3px solid white;
        border-radius:50%;
        box-shadow:0 1px 5px rgba(0,0,0,0.5);
        display:flex;
        align-items:center;
        justify-content:center;
        color:white;
        font-weight:bold;
        font-size:13px;
      ">
        ${numero}
      </div>
    `
    : `
      <div style="
        width:18px;
        height:18px;
        background:${couleur};
        border:3px solid white;
        border-radius:50%;
        box-shadow:0 1px 5px rgba(0,0,0,0.5);
      "></div>
    `;


const icone =
  L.divIcon({

    className: "",

    html:
      contenuIcone,

    iconSize:
      numero > 0
        ? [34, 34]
        : [24, 24],

    iconAnchor:
      numero > 0
        ? [17, 17]
        : [12, 12]

  });


      const popup = `

        <div class="popup-title">
          ${escapeHtml(c.nom)}
        </div>

        <div class="popup-section">
          <span class="popup-label">
            Groupe
          </span><br>
          ${escapeHtml(c.groupe)}
        </div>

        <div class="popup-section">
          <span class="popup-label">
            Adresse
          </span><br>
          ${escapeHtml(c.adresse)}
        </div>

        <div class="popup-section">
          <span class="popup-label">
            Contact
          </span><br>
          ${escapeHtml(c.contact)}
        </div>

        <div class="popup-section">
          <span class="popup-label">
            Notes
          </span><br>
          ${escapeHtml(c.notes)}
        </div>

        <div class="popup-section">
          <span class="popup-label">
            Statut
          </span><br>
          <b style="color:${couleur}">
            ${escapeHtml(c.statut)}
          </b>
        </div>

        <button
          id="ajouterRoute-${c.id}"
          style="
            margin-top:10px;
            width:100%;
            padding:8px;
            border:none;
            border-radius:6px;
            background:#2c3e50;
            color:white;
            cursor:pointer;
          "
        >
          Ajouter à l'itinéraire
        </button>

      `;


      const marker =
  L.marker(
    [
      c.latitude,
      c.longitude
    ],
    {
      icon: icone
    }
  )
  .addTo(markersLayer)
  .bindPopup(popup);


// Clic sur le marqueur
marker.on(
  "click",
  function() {

    if (modeItineraire) {

      setTimeout(function() {

        const bouton =
          document.getElementById(
            "ajouterRoute-" + c.id
          );

        if (bouton) {

          bouton.onclick =
            function() {

              ajouterAItineraire(c);

            };

        }

      }, 50);

    }

  }
);

    });


    document.getElementById("counter").textContent =
      visibles.length +
      " concessionnaire(s) affiché(s)";


    // Ajuster la carte
    if (visibles.length > 0) {

      const bounds =
        L.latLngBounds(
          visibles.map(c => [
            c.latitude,
            c.longitude
          ])
        );

      map.fitBounds(
        bounds,
        {
          padding: [40, 40]
        }
      );

    }

  }


  // ==================================================
  // PROTECTION CONTRE HTML DANS LES DONNÉES
  // ==================================================

  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

// ==================================================
// MODE ITINÉRAIRE
// ==================================================

function activerModeItineraire() {

  modeItineraire = !modeItineraire;

  const bouton =
    document.getElementById("routeMode");

  if (modeItineraire) {

    bouton.textContent =
      "✓ Mode itinéraire actif";

    bouton.classList.add("active");

    document.getElementById("status").textContent =
      "Cliquez sur les concessionnaires pour les ajouter à l'itinéraire.";

  }
  else {

    bouton.textContent =
      "Créer un itinéraire";

    bouton.classList.remove("active");

    document.getElementById("status").textContent =
      "Données SharePoint chargées.";

  }

}

  

function ajouterAItineraire(concessionnaire) {

  // Éviter les doublons
  if (
    itineraire.some(
      c => c.id === concessionnaire.id
    )
  ) {
    return;
  }

  itineraire.push(concessionnaire);

  afficherItineraire();

  afficherConcessionnaires();

  // Modifier visuellement le bouton du popup
  const bouton =
    document.getElementById(
      "ajouterRoute-" + concessionnaire.id
    );

  if (bouton) {

    bouton.textContent =
      "✓ Ajouté à l’itinéraire";

    bouton.style.background =
      "#27ae60";

    bouton.disabled =
      true;

    bouton.style.cursor =
      "default";

  }

}


function retirerDeItineraire(id) {

  itineraire =
    itineraire.filter(
      c => c.id !== id
    );

  afficherItineraire();

}


function afficherItineraire() {

  const liste =
    document.getElementById("routeList");

  const bouton =
    document.getElementById("clearRoute");

  if (itineraire.length === 0) {

    liste.innerHTML = `
      <div class="route-empty">
        Aucun arrêt sélectionné.
      </div>
    `;

    bouton.style.display = "none";

    return;

  }


  bouton.style.display = "block";


  liste.innerHTML =
    itineraire
      .map(function(c, index) {

        return `
          <div class="route-stop">

            <div class="route-number">
              ${index + 1}
            </div>

            <div class="route-name">
              ${escapeHtml(c.nom)}
            </div>

            <button
              class="route-remove"
              onclick="retirerDeItineraire('${c.id}')"
              title="Retirer"
            >
              ×
            </button>

          </div>
        `;

      })
      .join("");

}

document
  .getElementById("routeMode")
  .addEventListener(
    "click",
    activerModeItineraire
  );


document
  .getElementById("clearRoute")
  .addEventListener(
    "click",
    function() {

      itineraire = [];

      afficherItineraire();

    }
  );


  
  // ==================================================
  // ÉVÉNEMENTS
  // ==================================================

  document
    .getElementById("search")
    .addEventListener(
      "input",
      afficherConcessionnaires
    );


  document
    .getElementById("groupe")
    .addEventListener(
      "change",
      afficherConcessionnaires
    );


  document
    .getElementById("statut")
    .addEventListener(
      "change",
      afficherConcessionnaires
    );


  document
    .getElementById("resetFilters")
    .addEventListener(
      "click",
      function() {

        document.getElementById("search").value = "";
        document.getElementById("groupe").value = "";
        document.getElementById("statut").value = "";

        afficherConcessionnaires();

      }
    );


  document
    .getElementById("fitMap")
    .addEventListener(
      "click",
      function() {

        const filtres =
          obtenirFiltres();

        const visibles =
          concessionnaires.filter(
            c =>
              concessionnaireCorrespond(
                c,
                filtres
              )
          );

        if (visibles.length === 0) {
          return;
        }

        const bounds =
          L.latLngBounds(
            visibles.map(c => [
              c.latitude,
              c.longitude
            ])
          );

        map.fitBounds(
          bounds,
          {
            padding: [40, 40]
          }
        );

      }
    );


  // ==================================================
  // LÉGENDE
  // ==================================================

  const legend =
    L.control({
      position: "bottomright"
    });


  legend.onAdd =
    function() {

      const div =
        L.DomUtil.create(
          "div",
          "legend"
        );


      div.innerHTML = `

        <b>Statut</b><br>

        <i style="background:#2ecc71"></i>
        Déjà client<br>

        <i style="background:#f39c12"></i>
        Déjà approché<br>

        <i style="background:#3498db"></i>
        Client MPP / Balcan<br>

        <i style="background:#e74c3c"></i>
        À venir<br>

      `;


      return div;

    };


  legend.addTo(map);


 // ==================================================
// DÉMARRAGE
// ==================================================

(async function() {

  try {

    // Initialisation obligatoire de MSAL 4.x
    await msalInstance.initialize();

    // Traiter le retour après loginRedirect
    await msalInstance.handleRedirectPromise();

  }
  catch (error) {

    console.error(
      "Erreur d'initialisation/authentification Microsoft :",
      error
    );

    document.getElementById("status").innerHTML =
      "<b>Erreur Microsoft :</b> " +
      error.message;

    return;

  }

  await chargerConcessionnaires();

})();

</script>
