<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  // ==================================================
  // CONFIGURATION MICROSOFT
  // ==================================================

  const CLIENT_ID =
    "d6c9bd33-1318-4052-8a82-66e70ea9f386";

  const TENANT_ID =
    "e64463ac-e97e-4259-9af9-eb6f999c1a60";

  const SHAREPOINT_HOST =
    "distributiongp403.sharepoint.com";

  const SHAREPOINT_SITE_PATH =
    "/sites/DISTRIBUTIONGP";

  const SHAREPOINT_LIST_NAME =
    "Concessionnaires";


  // ==================================================
  // INITIALISATION MSAL
  // ==================================================

  const msalConfig = {

    auth: {
      clientId: CLIENT_ID,
      authority:
        "https://login.microsoftonline.com/" + TENANT_ID,

      redirectUri:
        window.location.origin + "/"
    },

    cache: {
      cacheLocation: "sessionStorage",
      storeAuthStateInCookie: false
    }

  };


  const msalInstance =
    new msal.PublicClientApplication(msalConfig);


  const loginRequest = {

    scopes: [
      "Sites.Read.All"
    ]

  };


  // ==================================================
  // VARIABLES
  // ==================================================

  let concessionnaires = [];

  let markersLayer =
    L.layerGroup();

  // ==================================================
  // VARIABLES ITINÉRAIRE
  // ==================================================
  
let modeItineraire = false;
  
let itineraire = [];
  
let routeLayer = null;

  // ==================================================
  // CARTE
  // ==================================================

 const map =
  L.map("map").setView(
    [45.55, -73.5],
    8
  );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  markersLayer.addTo(map);


  // ==================================================
  // COULEUR DES STATUTS
  // ==================================================

  function couleurStatut(statut) {

    if (!statut) {
      return "#7f8c8d";
    }

    const s =
      String(statut).toLowerCase();

    if (
      s.includes("déjà client") ||
      s.includes("deja client")
    ) {
      return "#2ecc71"; // Vert
    }

    if (
      s.includes("déjà approché") ||
      s.includes("deja approche")
    ) {
      return "#f39c12"; // Jaune/Orange
    }

    if (
      s.includes("client mpp") ||
      s.includes("balcan")
    ) {
      return "#3498db"; // Bleu
    }
    

    if (
      s.includes("à venir") ||
      s.includes("a venir")
    ) {
      return "#e74c3c"; // Rouge
    }

    return "#7f8c8d";
  }


  // ==================================================
  // OBTENIR UNE VALEUR DE CHAMP SHAREPOINT
  // ==================================================

  function getField(fields, possibleNames) {

    if (!fields) {
      return "";
    }

    const keys =
      Object.keys(fields);

    for (const name of possibleNames) {

      if (fields[name] !== undefined) {
        return fields[name];
      }

    }

    // Recherche insensible à la casse
    for (const key of keys) {

      const normalizedKey =
        key
          .toLowerCase()
          .replace(/[\s_-]/g, "");

      for (const name of possibleNames) {

        const normalizedName =
          name
            .toLowerCase()
            .replace(/[\s_-]/g, "");

        if (
          normalizedKey === normalizedName
        ) {
          return fields[key];
        }

      }

    }

    return "";
  }


  // ==================================================
  // TRANSFORMER UN ÉLÉMENT SHAREPOINT
  // ==================================================

 function convertirConcessionnaire(item) {

  const fields =
    item.fields || {};
   console.log("FIELDS SHAREPOINT :", fields);

  return {

    id:
      item.id,

    nom:
      getField(
        fields,
        [
          "Concessionnaire",
          "Title",
          "Nom"
        ]
      ),

    groupe:
      getField(
        fields,
        [
          "Groupe"
        ]
      ),

    adresse:
      getField(
        fields,
        [
          "Adresse"
        ]
      ),

    contact:
      getField(
        fields,
        [
          "Contact"
        ]
      ),

    notes:
      getField(
        fields,
        [
          "Notes"
        ]
      ),

    statut:
      getField(
        fields,
        [
          "Statut"
        ]
      ),

    dernièreCommande:
      getField(
        fields,
        [
          "Dernière commande"
        ]
      ),

    longitude:
      parseFloat(
        getField(
          fields,
          [
            "Longitude"
          ]
        )
      ),

    latitude:
      parseFloat(
        getField(
          fields,
          [
            "Latitude"
          ]
        )
      )

  };

}

  // ==================================================
  // AUTHENTIFICATION
  // ==================================================

  async function obtenirToken() {

    const comptes =
      msalInstance.getAllAccounts();

    if (comptes.length === 0) {

      document.getElementById("status").textContent =
        "Connexion Microsoft 365 requise...";

      await msalInstance.loginRedirect(
        loginRequest
      );

      return null;

    }

    const compte =
      comptes[0];

    try {

      const response =
        await msalInstance.acquireTokenSilent({

          ...loginRequest,

          account: compte

        });

      return response.accessToken;

    }
    catch (error) {

      console.log(
        "Token silencieux impossible:",
        error
      );

      await msalInstance.acquireTokenRedirect(
        loginRequest
      );

      return null;

    }

  }


  // ==================================================
  // RÉCUPÉRER LE SITE SHAREPOINT
  // ==================================================

  async function obtenirSite(token) {

    const url =
      "https://graph.microsoft.com/v1.0/sites/" +
      SHAREPOINT_HOST +
      ":" +
      SHAREPOINT_SITE_PATH;

    const response =
      await fetch(
        url,
        {
          headers: {
            Authorization:
              "Bearer " + token
          }
        }
      );

    if (!response.ok) {

      const texte =
        await response.text();

      throw new Error(
        "Impossible de récupérer le site SharePoint: " +
        response.status +
        " " +
        texte
      );

    }

    return await response.json();

  }


  // ==================================================
  // RÉCUPÉRER LA LISTE
  // ==================================================

  async function obtenirListe(
    token,
    siteId
  ) {

    const url =
      "https://graph.microsoft.com/v1.0/sites/" +
      encodeURIComponent(siteId) +
      "/lists/" +
      encodeURIComponent(SHAREPOINT_LIST_NAME) +
      "/items?expand=fields&$top=999";

    const response =
      await fetch(
        url,
        {
          headers: {
            Authorization:
              "Bearer " + token
          }
        }
      );

    if (!response.ok) {

      const texte =
        await response.text();

      throw new Error(
        "Impossible de récupérer la liste SharePoint: " +
        response.status +
        " " +
        texte
      );

    }

    return await response.json();

  }


  // ==================================================
  // CHARGER LES CONCESSIONNAIRES
  // ==================================================

  async function chargerConcessionnaires() {

    try {

      document.getElementById("status").textContent =
        "Connexion à Microsoft 365...";

      const token =
        await obtenirToken();

      if (!token) {
        return;
      }


      document.getElementById("status").textContent =
        "Recherche du site SharePoint...";


      const site =
        await obtenirSite(token);


      document.getElementById("status").textContent =
        "Chargement des concessionnaires...";


      const data =
        await obtenirListe(
          token,
          site.id
        );


      concessionnaires =
        (data.value || [])
          .map(convertirConcessionnaire)
          .filter(function(c) {

            return (
              Number.isFinite(c.latitude) &&
              Number.isFinite(c.longitude)
            );

          });


      remplirFiltres();

      afficherConcessionnaires();

      document.getElementById("status").textContent =
        "Données SharePoint chargées.";

    }
    catch (error) {

      console.error(error);

      document.getElementById("status").innerHTML =
        "<b>Erreur :</b> " +
        error.message;

    }

  }


  // ==================================================
  // REMPLIR LES FILTRES
  // ==================================================

  function remplirFiltres() {

    const groupeSelect =
      document.getElementById("groupe");

    const statutSelect =
      document.getElementById("statut");


    // Nettoyer
    groupeSelect.innerHTML =
      '<option value="">Tous les groupes</option>';

    statutSelect.innerHTML =
      '<option value="">Tous les statuts</option>';


    // GROUPES
    const groupes =
      [
        ...new Set(
          concessionnaires
            .map(c => c.groupe)
            .filter(Boolean)
        )
      ]
      .sort();


    groupes.forEach(function(groupe) {

      const option =
        document.createElement("option");

      option.value =
        groupe;

      option.textContent =
        groupe;

      groupeSelect.appendChild(option);

    });


    // STATUTS
    const statuts =
      [
        ...new Set(
          concessionnaires
            .map(c => c.statut)
            .filter(Boolean)
        )
      ]
      .sort();


    statuts.forEach(function(statut) {

      const option =
        document.createElement("option");

      option.value =
        statut;

      option.textContent =
        statut;

      statutSelect.appendChild(option);

    });

  }


  // ==================================================
  // FILTRER
  // ==================================================

  function obtenirFiltres() {

    return {

      recherche:
        document
          .getElementById("search")
          .value
          .toLowerCase()
          .trim(),

      groupe:
        document
          .getElementById("groupe")
          .value,

      statut:
        document
          .getElementById("statut")
          .value

    };

  }


  function concessionnaireCorrespond(c, filtres) {

    const texte =
      (
        (c.nom || "") +
        " " +
        (c.adresse || "") +
        " " +
        (c.contact || "")
      )
      .toLowerCase();


    if (
      filtres.recherche &&
      !texte.includes(filtres.recherche)
    ) {
      return false;
    }


    if (
      filtres.groupe &&
      c.groupe !== filtres.groupe
    ) {
      return false;
    }


    if (
      filtres.statut &&
      c.statut !== filtres.statut
    ) {
      return false;
    }


    return true;

  }


  // ==================================================
  // AFFICHER LES MARQUEURS
  // ==================================================

  function afficherConcessionnaires() {

    markersLayer.clearLayers();


    const filtres =
      obtenirFiltres();


    const visibles =
      concessionnaires.filter(
        c =>
          concessionnaireCorrespond(
            c,
            filtres
          )
      );


    visibles.forEach(function(c) {
      
      
      const couleur =
  couleurStatut(c.statut);


// Vérifier si le concessionnaire est
// déjà dans l'itinéraire
const numero =
  itineraire.findIndex(
    x => x.id === c.id
  ) + 1;


// Si présent dans l'itinéraire,
// afficher son numéro.
// Sinon afficher la pastille normale.

const contenuIcone =
  numero > 0
    ? `
      <div style="
        width:28px;
        height:28px;
        background:${couleur};
        border:3px solid white;
        border-radius:50%;
        box-shadow:0 1px 5px rgba(0,0,0,0.5);
        display:flex;
        align-items:center;
        justify-content:center;
        color:white;
        font-weight:bold;
        font-size:13px;
      ">
        ${numero}
      </div>
    `
    : `
      <div style="
        width:18px;
        height:18px;
        background:${couleur};
        border:3px solid white;
        border-radius:50%;
        box-shadow:0 1px 5px rgba(0,0,0,0.5);
      "></div>
    `;


const icone =
  L.divIcon({

    className: "",

    html:
      contenuIcone,

    iconSize:
      numero > 0
        ? [34, 34]
        : [24, 24],

    iconAnchor:
      numero > 0
        ? [17, 17]
        : [12, 12]

  });


      const popup = `

        <div class="popup-title">
          ${escapeHtml(c.nom)}
        </div>

        <div class="popup-section">
          <span class="popup-label">
            Groupe
          </span><br>
          ${escapeHtml(c.groupe)}
        </div>

        <div class="popup-section">
          <span class="popup-label">
            Adresse
          </span><br>
          ${escapeHtml(c.adresse)}
        </div>

        <div class="popup-section">
          <span class="popup-label">
            Contact
          </span><br>
          ${escapeHtml(c.contact)}
        </div>

        <div class="popup-section">
          <span class="popup-label">
            Notes
          </span><br>
          ${escapeHtml(c.notes)}
        </div>

        <div class="popup-section">
          <span class="popup-label">
            Statut
          </span><br>
          <b style="color:${couleur}">
            ${escapeHtml(c.statut)}
          </b>
        </div>

        <div class="popup-section">
          <span class="popup-label">
            Dernière commande
          </span><br>
          <b style="color:${couleur}">
            ${escapeHtml(c.dernièreCommande)}
          </b>
        </div>

        <button
          id="ajouterRoute-${c.id}"
          style="
            margin-top:10px;
            width:100%;
            padding:8px;
            border:none;
            border-radius:6px;
            background:#2c3e50;
            color:white;
            cursor:pointer;
          "
        >
          Ajouter à l'itinéraire
        </button>

      `;


      const marker =
  L.marker(
    [
      c.latitude,
      c.longitude
    ],
    {
      icon: icone
    }
  )
  .addTo(markersLayer)
  .bindPopup(popup);


// Clic sur le marqueur
marker.on(
  "click",
  function() {

    setTimeout(function() {

      const bouton =
        document.getElementById(
          "ajouterRoute-" + c.id
        );

      if (!bouton) {
        return;
      }

      // Si déjà dans l'itinéraire
      if (
        itineraire.some(
          x => x.id === c.id
        )
      ) {

        bouton.textContent =
          "✓ Déjà dans l’itinéraire";

        bouton.style.background =
          "#27ae60";

        bouton.disabled =
          true;

        return;
      }

      // Le bouton fonctionne toujours
      bouton.onclick =
        function() {

          // Activer automatiquement le mode itinéraire
          if (!modeItineraire) {

            modeItineraire = true;

            const boutonMode =
              document.getElementById("routeMode");

            boutonMode.textContent =
              "✓ Mode itinéraire actif";

            boutonMode.classList.add("active");

          }

          // Ajouter le concessionnaire
          ajouterAItineraire(c);

        };

    }, 50);

  }
);
    });


    document.getElementById("counter").textContent =
      visibles.length +
      " concessionnaire(s) affiché(s)";


// Ajuster la carte
if (visibles.length > 0) {

  const bounds =
    L.latLngBounds(
      visibles.map(c => [
        c.latitude,
        c.longitude
      ])
    );

  map.fitBounds(
    bounds,
    {
      padding: [40, 40]
    }
  );

}
}

  // ==================================================
  // PROTECTION CONTRE HTML DANS LES DONNÉES
  // ==================================================

  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

// ==================================================
// MODE ITINÉRAIRE
// ==================================================

function activerModeItineraire() {

  modeItineraire = !modeItineraire;

  const bouton =
    document.getElementById("routeMode");

  if (modeItineraire) {

    bouton.textContent =
      "✓ Mode itinéraire actif";

    bouton.classList.add("active");

    document.getElementById("status").textContent =
      "Cliquez sur les concessionnaires pour les ajouter à l'itinéraire.";

  }
  else {

    bouton.textContent =
      "Créer un itinéraire";

    bouton.classList.remove("active");

    document.getElementById("status").textContent =
      "Données SharePoint chargées.";

  }

}

  

function ajouterAItineraire(concessionnaire) {

  // Éviter les doublons
  if (
    itineraire.some(
      c => c.id === concessionnaire.id
    )
  ) {
    return;
  }

  itineraire.push(concessionnaire);

  afficherItineraire();

  afficherConcessionnaires();

  // Modifier visuellement le bouton du popup
  const bouton =
    document.getElementById(
      "ajouterRoute-" + concessionnaire.id
    );

  if (bouton) {

    bouton.textContent =
      "✓ Ajouté à l’itinéraire";

    bouton.style.background =
      "#27ae60";

    bouton.disabled =
      true;

    bouton.style.cursor =
      "default";

  }

}

function afficherItineraire() {

const liste =
  document.getElementById("routeList");

const bouton =
  document.getElementById("clearRoute");

const boutonCalcul =
  document.getElementById("calculateRoute");

const routeInfo =
  document.getElementById("routeInfo");

const boutonGoogle =
  document.getElementById("googleMapsRoute");


  // Aucun arrêt
  if (itineraire.length === 0) {

    liste.innerHTML = `
      <div class="route-empty">
        Aucun arrêt sélectionné.
      </div>
    `;

    bouton.style.display = "none";
    boutonCalcul.style.display = "none";
    routeInfo.style.display = "none";

    effacerRoute();

    return;
  }


  // Afficher les boutons
  bouton.style.display = "block";
  boutonCalcul.style.display = "block";
  boutonGoogle.style.display =
  itineraire.length >= 2
    ? "block"
    : "none";


  // Construire la liste
  liste.innerHTML =
    itineraire
      .map(function(c, index) {

        return `
          <div
            class="route-stop"
            draggable="true"
            data-id="${c.id}"
          >

            <div class="route-number">
              ${index + 1}
            </div>

            <div class="route-name">
  <strong>${escapeHtml(c.nom)}</strong>
  <div style="font-size:11px; color:#777; margin-top:2px;">
    ${escapeHtml(c.groupe)}
  </div>
</div>

            <button
              class="route-remove"
              data-remove-id="${c.id}"
              title="Retirer"
            >
              ×
            </button>

          </div>
        `;

      })
      .join("");


  // ==================================================
  // SUPPRIMER UN ARRÊT
  // ==================================================

  liste
    .querySelectorAll(".route-remove")
    .forEach(function(boutonRemove) {

      boutonRemove.addEventListener(
        "click",
        function(event) {

          event.stopPropagation();

          const id =
            boutonRemove.getAttribute(
              "data-remove-id"
            );

          retirerDeItineraire(id);

        }
      );

    });


  // ==================================================
  // DRAG & DROP
  // ==================================================

  let elementDeplace = null;


  liste
    .querySelectorAll(".route-stop")
    .forEach(function(element) {


      element.addEventListener(
        "dragstart",
        function(event) {

          elementDeplace = element;

          element.classList.add("dragging");

          event.dataTransfer.effectAllowed =
            "move";

        }
      );


      element.addEventListener(
        "dragend",
        function() {

          element.classList.remove("dragging");

          liste
            .querySelectorAll(".route-stop")
            .forEach(function(el) {

              el.classList.remove("drag-over");

            });

          elementDeplace = null;

        }
      );


      element.addEventListener(
        "dragover",
        function(event) {

          event.preventDefault();

          if (
            elementDeplace &&
            element !== elementDeplace
          ) {

            element.classList.add("drag-over");

          }

        }
      );


      element.addEventListener(
        "dragleave",
        function() {

          element.classList.remove("drag-over");

        }
      );


      element.addEventListener(
        "drop",
        function(event) {

          event.preventDefault();

          element.classList.remove("drag-over");


          if (
            !elementDeplace ||
            element === elementDeplace
          ) {
            return;
          }


          const idDeplace =
            elementDeplace.getAttribute(
              "data-id"
            );

          const idCible =
            element.getAttribute(
              "data-id"
            );


          const ancienIndex =
            itineraire.findIndex(
              c =>
                String(c.id) ===
                String(idDeplace)
            );


          const nouvelIndex =
            itineraire.findIndex(
              c =>
                String(c.id) ===
                String(idCible)
            );


          if (
            ancienIndex === -1 ||
            nouvelIndex === -1
          ) {
            return;
          }


          const elementRetire =
            itineraire.splice(
              ancienIndex,
              1
            )[0];


          itineraire.splice(
            nouvelIndex,
            0,
            elementRetire
          );


          // Réafficher les numéros
          afficherItineraire();

          afficherConcessionnaires();


          // Si une route existe déjà,
          // la recalculer avec le nouvel ordre
          if (itineraire.length >= 2) {

            calculerRoute();

          }

        }

      );

    });

}

// ==================================================
// RETIRER UN ARRÊT DE L'ITINÉRAIRE
// ==================================================

function retirerDeItineraire(id) {

  itineraire =
    itineraire.filter(
      c =>
        String(c.id) !==
        String(id)
    );


  afficherItineraire();

  afficherConcessionnaires();


  // Recalculer automatiquement
  // s'il reste au moins 2 arrêts
  if (itineraire.length >= 2) {

    calculerRoute();

  }
  else {

    effacerRoute();

  }

}


// ==================================================
// EFFACER LA ROUTE SUR LA CARTE
// ==================================================

function effacerRoute() {

  if (routeLayer) {

    map.removeLayer(routeLayer);

    routeLayer = null;

  }


  const routeInfo =
    document.getElementById("routeInfo");

  if (routeInfo) {

    routeInfo.style.display = "none";

  }


  document.getElementById(
    "routeDistance"
  ).textContent = "—";


  document.getElementById(
    "routeDuration"
  ).textContent = "—";

}


// ==================================================
// CALCULER LA ROUTE
// ==================================================

async function calculerRoute() {

  if (itineraire.length < 2) {

    alert(
      "Vous devez sélectionner au moins 2 concessionnaires."
    );

    return;

  }


  const bouton =
    document.getElementById("calculateRoute");


  bouton.disabled = true;

  bouton.textContent =
    "Calcul de la route...";


  try {

    const coordonnees =
      itineraire
        .map(function(c) {

          return (
            c.longitude +
            "," +
            c.latitude
          );

        })
        .join(";");


    // Toujours en automobile
    const url =
      "https://router.project-osrm.org/route/v1/driving/" +
      coordonnees +
      "?overview=full&geometries=geojson";


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Impossible de calculer la route."
      );

    }


    const data =
      await response.json();


    if (
      data.code !== "Ok" ||
      !data.routes ||
      data.routes.length === 0
    ) {

      throw new Error(
        "Aucune route disponible."
      );

    }


    const route =
      data.routes[0];


    // Supprimer l'ancienne route
    effacerRoute();


    // ==================================================
    // DESSINER LA ROUTE
    // ==================================================

    routeLayer =
      L.geoJSON(
        route.geometry,
        {
          style: {
            color: "#2c3e50",
            weight: 5,
            opacity: 0.85
          }
        }
      ).addTo(map);


    // ==================================================
    // DISTANCE
    // ==================================================

    const distanceKm =
      route.distance / 1000;


    document.getElementById(
      "routeDistance"
    ).textContent =
      distanceKm.toFixed(1) + " km";


    // ==================================================
    // DURÉE
    // ==================================================

    const totalMinutes =
      Math.round(
        route.duration / 60
      );


    const heures =
      Math.floor(
        totalMinutes / 60
      );


    const minutes =
      totalMinutes % 60;


    let dureeTexte;


    if (heures > 0) {

      dureeTexte =
        heures +
        " h " +
        String(minutes).padStart(2, "0");

    }
    else {

      dureeTexte =
        minutes +
        " min";

    }


    document.getElementById(
      "routeDuration"
    ).textContent =
      dureeTexte;


    document.getElementById(
      "routeInfo"
    ).style.display =
      "block";


    // Ajuster la carte à la route
    map.fitBounds(
      routeLayer.getBounds(),
      {
        padding: [60, 60]
      }
    );


    document.getElementById(
      "status"
    ).textContent =
      "Itinéraire calculé en automobile.";


  }
  catch (error) {

    console.error(
      "Erreur calcul itinéraire:",
      error
    );


    alert(
      "Impossible de calculer l'itinéraire."
    );

  }
  finally {

    bouton.disabled = false;

    bouton.textContent =
      "Recalculer l’itinéraire";

  }

}

// ==================================================
// OUVRIR LES ARRÊTS DANS GOOGLE MAPS
// ==================================================

function ouvrirGoogleMaps() {

  if (itineraire.length === 0) {

    alert(
      "Vous devez sélectionner au moins un concessionnaire."
    );

    return;

  }

  const destinations =
    itineraire
      .map(function(c) {

        return (
          c.latitude +
          "," +
          c.longitude
        );

      })
      .join("/");

  const url =
    "https://www.google.com/maps/dir/" +
    destinations;

  window.open(
    url,
    "_blank"
  );

}
  

document
  .getElementById("routeMode")
  .addEventListener(
    "click",
    activerModeItineraire
  );


document
  .getElementById("clearRoute")
  .addEventListener(
    "click",
    function() {

      itineraire = [];

      effacerRoute();

      afficherItineraire();

      afficherConcessionnaires();

    }
  );

  // ==================================================
  // BOUTON CALCULER L'ITINÉRAIRE
  // ==================================================
  
  document
  .getElementById("calculateRoute")
  .addEventListener(
    "click",
    calculerRoute
  );

  // ==================================================
// OUVRIR L'ITINÉRAIRE DANS GOOGLE MAPS
// ==================================================

document
  .getElementById("googleMapsRoute")
  .addEventListener(
    "click",
    function() {

      if (itineraire.length === 0) {
        return;
      }

      const points =
        itineraire.map(function(c) {

          return encodeURIComponent(
            c.nom +
            " - " +
            c.groupe +
            ", " +
            c.adresse
          );

        });

      const destination =
        points[points.length - 1];

      const waypoints =
        points
          .slice(0, -1)
          .join("|");

      let url =
        "https://www.google.com/maps/dir/?api=1" +
        "&destination=" +
        destination;

      if (waypoints) {

        url +=
          "&waypoints=" +
          waypoints;

      }

      window.open(
        url,
        "_blank"
      );

    }
  );

  
  // ==================================================
  // ÉVÉNEMENTS
  // ==================================================

  document
    .getElementById("search")
    .addEventListener(
      "input",
      afficherConcessionnaires
    );


  document
    .getElementById("groupe")
    .addEventListener(
      "change",

    );


  document
    .getElementById("statut")
    .addEventListener(
      "change",
      afficherConcessionnaires
    );

    .getElementById("resetFilters")
    .addEventListener(

        document.getElementById("groupe").value = "";
        document.getElementById("statut").value = "";

        afficherConcessionnaires();

      }
    );


  document
    .getElementById("fitMap")
    .addEventListener(
      "click",
      function() {

        const filtres =
          obtenirFiltres();

        const visibles =
          concessionnaires.filter(
            c =>
              concessionnaireCorrespond(
                c,
                filtres
              )
          );

        if (visibles.length === 0) {
          return;
        }

        const bounds =
          L.latLngBounds(
            visibles.map(c => [
              c.latitude,
              c.longitude
            ])
          );

        map.fitBounds(
          bounds,
          {
            padding: [40, 40]
          }
        );

      }
    );


  // ==================================================
  // LÉGENDE
  // ==================================================

  const legend =
    L.control({
      position: "bottomright"
    });


  legend.onAdd =
    function() {

      const div =
        L.DomUtil.create(
          "div",
          "legend"
        );


      div.innerHTML = `

        <b>Statut</b><br>

        <i style="background:#2ecc71"></i>
        Déjà client<br>

        <i style="background:#f39c12"></i>
        Déjà approché<br>

        <i style="background:#3498db"></i>
        Client MPP / Balcan<br>

        <i style="background:#e74c3c"></i>
        À venir<br>

      `;


      return div;

    };


  legend.addTo(map);


 // ==================================================
